<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BK | Visual</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: Helvetica neue thin, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.65)),
        url("./background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .box {
      max-width: 720px;
      padding: 40px 28px;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .label {
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(48px, 9vw, 92px);
      font-weight: 300;
      margin-bottom: 24px;
    }

    p {
      font-size: 13px;
      line-height: 1.7;
    }

    .name {
      margin-top: 36px;
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <main class="box">
    <div class="label">Portfolio Website</div>

    <h1>COMING SOON</h1>

    <p>
      .
    </p>

    <div class="name">BETTY K</div>
  </main>
</body>
</html>
